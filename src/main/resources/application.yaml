spring:
  application:
    name: dschang-signal
  profiles:
    active: local
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

server:
  base-path: /api

jwt:
  secret: dschang-signal-secret-key-must-be-at-least-32-chars
  expiration: 86400000

logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.boot.autoconfigure.flyway: DEBUG