spring:
  application:
    name: dschang-signal
  profiles:
    active: local
  datasource:
    url: jdbc:postgresql://localhost:5432/dschang-signal
    username:
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  web:
    resources:
      static-locations: file:${STORAGE_LOCAL_PATH:./uploads}/

server:
  base-path: /api

storage:
  local:
    path: ${STORAGE_LOCAL_PATH:./uploads}
    base-url: /uploads
