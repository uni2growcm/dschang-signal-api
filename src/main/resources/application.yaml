spring:
  application:
    name: dschang-signal
  profiles:
    active: local
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 100MB
  web:
    resources:
      static-locations: file:${STORAGE_LOCAL_PATH:./uploads}/

server:
  base-path: /api

logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.boot.autoconfigure.flyway: DEBUG

storage:
  local:
    path: ${STORAGE_LOCAL_PATH:./uploads}
    base-url: /uploads
