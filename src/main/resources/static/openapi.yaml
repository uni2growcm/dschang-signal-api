openapi: 3.0.3
info:
  title: Dschang's Signal API
  description: REST API backend for the Dschang's Signal citizen issue reporting platform.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api

tags:
  - name: Auth
  - name: User

paths:
  /reports:
    post:
      operationId: createReport
      tags: [ Report ]
      summary: Submit a problem report
      requestBody:
        required: true
        content:
          application/json:
             schema:
               $ref: '#/components/schemas/CreateReportRequest'
      responses:
        201:
          description: Report created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
  /users:
    get:
      operationId: getAllUsers
      tags: [ User ]
      summary: Get paginated list of users
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/Sort"
      responses:
        '200':
          description: Paginated list of users
          headers:
            X-Total-Count:
              $ref: '#/components/headers/X-Total-Count'
            X-Page-Size:
              $ref: '#/components/headers/X-Page-Size'
            X-Page-Number:
              $ref: '#/components/headers/X-Page-Number'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

  /login:
    post:
      operationId: login
      tags: [ Auth ]
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: JWT token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /register:
    post:
      operationId: register
      tags: [ Auth ]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created successfully
        '409':
          description: Email already in use

components:
  headers:
    X-Total-Count:
      schema:
        type: integer
      description: Total amount of elements for this query
    X-Page-Number:
      schema:
        type: integer
      description: Page number starting from 0
    X-Page-Size:
      schema:
        type: integer
      description: Page size

  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
    Sort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        default: 'fullName'

  schemas:
    CreateReportRequest:
      type: object
      required:
        - title
        - description
        - category
      properties:
        title:
          type: string
          example: Electricity problem
        description:
          type: string
          example: The Foto district has been without electricity for two months now.
        category:
          type: string
          example: Electricity
        locationText:
          type: string
          example: District Foto
        photoUrl:
          type: string
          example: https://example.com/photo.jpg

    Report:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        category:
          type: string
        locationText:
          type: string
        photoUrl:
          type: string
        moderationStatus:
          type: string
          example: PENDING_REVIEW
        reportStatus:
          type: string
          example: PENDING
        rejectionReason:
          type: string
        createdAt:
          type: string
          format: date-time
        reviewedAt:
          type: string
          format: date-time
        updatedAt:
           type: string
           format: date-time

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: moi@u2g.com
        password:
          type: string
          format: password
          example: P@ssword1

    RegisterRequest:
      type: object
      required:
        - email
        - password
        - fullName
      properties:
        email:
          type: string
          format: email
          example: moi@u2g.com
        password:
          type: string
          format: password
          example: P@ssword1
        fullName:
          type: string
          example: Duval Moi

    AuthResponse:
      type: object
      properties:
        token:
          type: string

    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        email:
          type: string
          format: email
          example: moi@u2g.com
        password:
          type: string
          format: password
          example: P@ssword1
        fullName:
          type: string
          example: Duval Moi
        role:
          type: string
          example: ADMIN
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
        isActive:
          type: boolean
          example: true

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        message:
          type: string