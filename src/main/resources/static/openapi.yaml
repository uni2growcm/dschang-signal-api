openapi: 3.0.3
info:
  title: Dschang's Signal API
  description: REST API backend for the Dschang's Signal citizen issue reporting platform.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api

security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: User
  - name: Report
  - name: Category

paths:
  /login:
    post:
      operationId: login
      tags: [ Auth ]
      summary: Login user
      security:
        - basicAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: JWT token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /register:
    post:
      operationId: register
      tags: [ Auth ]
      summary: Register a new user
      security:
        - basicAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created successfully
        '409':
          description: Email already in use

  /logout:
    post:
      operationId: logout
      tags: [ Auth ]
      summary: Logout user
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Successfully logged out
        '401':
          description: Unauthorized - missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users:
    get:
      operationId: getAllUsers
      tags: [ User ]
      summary: Get paginated list of users
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/Sort"
      responses:
        '200':
          description: Paginated list of users
          headers:
            X-Total-Count:
              $ref: '#/components/headers/X-Total-Count'
            X-Page-Size:
              $ref: '#/components/headers/X-Page-Size'
            X-Page-Number:
              $ref: '#/components/headers/X-Page-Number'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

  /users/{id}:
    get:
      operationId: getUserById
      tags: [ User ]
      summary: Get a specific user by ID
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the user
          schema:
            type: integer
            format: int64
            example: 4
      responses:
        '200':
          description: User found successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/{id}/role:
    patch:
      operationId: changeUserRole
      tags: [ User ]
      summary: Change a user's role (Admin only)
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the user
          schema:
            type: integer
            format: int64
            example: 4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeRoleRequest'
      responses:
        '200':
          description: Role updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          description: Forbidden - Admin only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /reports/public:
    get:
      operationId: getPublicReports
      tags: [ Report ]
      summary: Get all validated reports
      security: [ ]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: sort
          in: query
          schema:
            type: string
            default: created_at
      responses:
        '200':
          description: List of validated reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Report'

  /reports/{id}:
    get:
      operationId: getReportById
      tags: [ Report ]
      summary: Get a specific report by ID
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the report
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '200':
          description: Report found successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '404':
          description: Report not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
        operationId: deleteReport
        tags:
          - Report
        summary: Delete a report
        description: >
          Only the author of the report can delete it, and only if the report status is PENDING.
        security:
          - bearerAuth: [ ]
        parameters:
          - name: id
            in: path
            required: true
            description: ID of the report to delete
            schema:
              type: integer
              format: int64
        responses:
          '204':
            description: Report deleted successfully
          '400':
            description: Report cannot be deleted because its status is not PENDING
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ErrorResponse'
          '403':
            description: Forbidden - only the author can delete this report
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ErrorResponse'
          '404':
            description: Report not found
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ErrorResponse'
  /categories:
    post:
      tags:
        - Category
      summary: Create a new category
      description: Create a category
      operationId: createCategory
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '201':
          description: Category created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Duplicate input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /media:
    post:
      operationId: uploadMedia
      tags: [ Media ]
      summary: Upload a media file
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ file ]
              properties:
                file:
                  type: string
                  format: binary
                description:
                  type: string
      responses:
        '201':
          description: Media uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaResponse'

    get:
      operationId: getAllMedia
      tags: [ Media ]
      summary: Get all media files
      responses:
        '200':
          description: List of media files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MediaResponse'

  /media/{mediaId}:
      delete:
        operationId: deleteMedia
        tags: [ Media ]
        summary: Delete a media file
        parameters:
          - name: mediaId
            in: path
            required: true
            schema:
              type: integer
        responses:
          '204':
            description: Media deleted successfully


  /reports/admin:
    get:
      tags: [ Report ]
      summary: Get all reports (Admin only)
      description: Retrieve all reports in the system with pagination and filtering.
      operationId: getAllReports
      security:
        - bearerAuth: [ ]
      parameters:
        - name: page
          in: query
          description: Page number (zero-based)
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          description: Number of items per page
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: sort
          in: query
          description: 'Sort by field and direction'
          required: false
          schema:
            type: string
            default: 'reportStatus'
            example: 'createdAt,desc'
        - name: moderationStatus
          in: query
          description: Filter by moderation status
          required: false
          schema:
            type: string
            enum: [ PENDING_REVIEW, RESOLVED, REJECTED ]
        - name: reportStatus
          in: query
          description: Filter by report status
          required: false
          schema:
            type: string
            enum: [ PENDING, IN_PROGRESS, RESOLVED ]
        - name: category
          in: query
          description: Filter by category
          required: false
          schema:
            type: string
        - name: fromDate
          in: query
          description: Filter reports created after this date (ISO format)
          required: false
          schema:
            type: string
            format: date-time
        - name: toDate
          in: query
          description: Filter reports created before this date (ISO format)
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Successful operation
          headers:
            X-Total-Count:
              schema:
                type: integer
              description: Total number of elements
            X-Page-Number:
              schema:
                type: integer
              description: Current page number
            X-Page-Size:
              schema:
                type: integer
              description: Number of items per page
            X-Total-Pages:
              schema:
                type: integer
              description: Total number of pages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Report'
        '401':
          description: Unauthorized - Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - User does not have ADMIN role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  headers:
    X-Total-Count:
      schema:
        type: integer
      description: Total amount of elements for this query
    X-Page-Number:
      schema:
        type: integer
      description: Page number starting from 0
    X-Page-Size:
      schema:
        type: integer
      description: Page size

  parameters:
    Page:
      name: page
      in: query
      description: Page number
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
    Size:
      name: size
      in: query
      description: Number of items per page
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
    Sort:
      name: sort
      in: query
      description: 'Sorting criteria (example: fullName)'
      required: false
      schema:
        type: string
        default: 'fullName'

  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: moi@u2g.com
        password:
          type: string
          format: password
          example: P@ssword1

    RegisterRequest:
      type: object
      required:
        - email
        - password
        - fullName
      properties:
        email:
          type: string
          format: email
          example: moi@u2g.com
        password:
          type: string
          format: password
          example: P@ssword1
        fullName:
          type: string
          example: Duval Moi

    AuthResponse:
      type: object
      properties:
        token:
          type: string

    ChangeRoleRequest:
      type: object
      required:
        - role
      properties:
        role:
          type: string
          enum: [ ADMIN, CITIZEN ]
          example: CITIZEN

    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        email:
          type: string
          format: email
          example: moi@u2g.com
        password:
          type: string
          format: password
          example: P@ssword1
        fullName:
          type: string
          example: Duval Moi
        role:
          type: string
          example: ADMIN
        createdAt:
          type: string
          format: date-time
          example: 2026-03-09T10:15:30Z
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          example: 2026-03-09T12:20:00Z
        isActive:
          type: boolean
          example: true

    Report:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: "Pothole on Kennedy Avenue"
        description:
          type: string
          example: "Large dangerous pothole on the roadway"
        locationText:
          type: string
          example: "Kennedy Avenue, in front of the university"
        moderationStatus:
          type: string
          enum: [ PENDING_REVIEW, RESOLVED, REJECTED ]
          example: "PENDING_REVIEW"
        reportStatus:
          type: string
          enum: [ PENDING, IN_PROGRESS, RESOLVED ]
          example: "PENDING"
        rejectionReason:
          type: string
          example: "Area not covered by municipality"
        createdAt:
          type: string
          format: date-time
          readOnly: true
          example: "2026-03-10T14:30:00Z"
        reviewedAt:
          type: string
          format: date-time
          example: "2026-03-11T09:15:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-03-10T14:30:00Z"
        createdBy:
          $ref: "#/components/schemas/User"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/CategoryResponse"

    CategoryRequest:
      required:
        - name
        - createdBy
      type: object
      properties:
        name:
          type: string
          example: "Road"
          maxLength: 50
          minLength: 2
        color:
          type: string
          example: "#FFD700"
          pattern: '^#[0-9A-Fa-f]{6}$'
          description: Hex color code (optional, random if not provided)
        createdBy:
          $ref: '#/components/schemas/User'

    CategoryResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Road"
          maxLength: 255
        color:
          type: string
          example: "#FF5733"
          pattern: '^#[0-9A-Fa-f]{6}$'
          description: Hex color code (e.g., #FF5733)
          maxLength: 10
        createdAt:
          type: string
          format: date-time
          example: "2026-03-10T10:30:00Z"
        createdBy:
          $ref: '#/components/schemas/User'

    MediaResponse:
      type: object
      properties:
        id:
          type: integer
        description:
          type: string
        type:
          type: string
        mimeType:
          type: string
        url:
          type: string
        originalName:
          type: string
        fileSize:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        message:
          type: string