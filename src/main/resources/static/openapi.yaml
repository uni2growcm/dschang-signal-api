openapi: 3.0.3
info:
  title: Dschang's Signal API
  description: REST API backend for the Dschang's Signal citizen issue reporting platform.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api

tags:
  - name: Auth
  - name: User

paths:
  /users:
    get:
      operationId: getAllUsers
      tags: [ User ]
      summary: Get paginated list of users
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/Sort"
      responses:
        '200':
          description: Paginated list of users
          headers:
            X-Total-Count:
              $ref: '#/components/headers/X-Total-Count'
            X-Page-Size:
              $ref: '#/components/headers/X-Page-Size'
            X-Page-Number:
              $ref: '#/components/headers/X-Page-Number'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

  /login:
    post:
      operationId: login
      tags: [ Auth ]
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: JWT token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /register:
    post:
      operationId: register
      tags: [ Auth ]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created successfully
        '409':
          description: Email already in use

  /media:
    post:
      operationId: uploadMedia
      tags: [ Media ]
      summary: Upload a media file
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ file ]
              properties:
                file:
                  type: string
                  format: binary
                description:
                  type: string
      responses:
        '201':
          description: Media uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaResponse'

    get:
      operationId: getAllMedia
      tags: [ Media ]
      summary: Get all media files
      responses:
        '200':
          description: List of media files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MediaResponse'

  /media/{mediaId}:
      delete:
        operationId: deleteMedia
        tags: [ Media ]
        summary: Delete a media file
        parameters:
          - name: mediaId
            in: path
            required: true
            schema:
              type: integer
        responses:
          '204':
            description: Media deleted successfully


components:
  headers:
    X-Total-Count:
      schema:
        type: integer
      description: Total amount of elements for this query
    X-Page-Number:
      schema:
        type: integer
      description: Page number starting from 0
    X-Page-Size:
      schema:
        type: integer
      description: Page size

  parameters:
    Page:
      name: page
      in: query
      description: Page number
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
    Size:
      name: size
      in: query
      description: Number of items per page
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
    Sort:
      name: sort
      in: query
      description: 'Sorting criteria (example: fullName)'
      required: false
      schema:
        type: string
        default: 'fullName'

  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: moi@u2g.com
        password:
          type: string
          format: password
          example: P@ssword1

    RegisterRequest:
      type: object
      required:
        - email
        - password
        - fullName
      properties:
        email:
          type: string
          format: email
          example: moi@u2g.com
        password:
          type: string
          format: password
          example: P@ssword1
        fullName:
          type: string
          example: Duval Moi

    AuthResponse:
      type: object
      properties:
        token:
          type: string

    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        email:
          type: string
          format: email
          example: moi@u2g.com
        password:
          type: string
          format: password
          example: P@ssword1
        fullName:
          type: string
          example: Duval Moi
        role:
          type: string
          example: ADMIN
        createdAt:
          type: string
          format: date-time
          example: 2026-03-09T10:15:30Z
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          example: 2026-03-09T12:20:00Z
        isActive:
          type: boolean
          example: true

    MediaResponse:
      type: object
      properties:
        id:
          type: integer
        description:
          type: string
        type:
          type: string
        mimeType:
          type: string
        url:
          type: string
        originalName:
          type: string
        fileSize:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        message:
          type: string